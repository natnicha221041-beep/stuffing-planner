<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stuffing &amp; Loading Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --text: #0f172a;
  --muted: #64748b;
  --primary: #1d4ed8;
  --primary-soft: #dbeafe;
  --side: #0b1324;
  --side-text: #cbd5e1;
  --green: #15803d;  --green-bg: #dcfce7;  --green-bar: #22c55e;
  --yellow: #a16207; --yellow-bg: #fef3c7; --yellow-bar: #f59e0b;
  --red: #b91c1c;    --red-bg: #fee2e2;    --red-bar: #ef4444;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 1px 3px rgba(15, 23, 42, .08);
  --font: 'IBM Plex Sans Thai', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); font-size: 14px; color: var(--text); background: var(--bg); line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
.mono { font-family: var(--mono); font-size: .92em; letter-spacing: -.01em; }
.muted { color: var(--muted); }
.right { text-align: right; }
.nowrap { white-space: nowrap; }
.hidden { display: none !important; }

/* ---------- Layout ---------- */
.app { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
.sidebar { background: var(--side); color: var(--side-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 20px 18px; border-bottom: 1px solid rgba(255,255,255,.07); }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand svg rect { fill: #2563eb; }
.brand svg path { stroke: #fff; stroke-width: 2; }
.brand strong { display: block; color: #fff; font-size: 15px; }
.brand span { font-size: 12px; color: #94a3b8; }
#nav { display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; }
#nav a { display: flex; align-items: center; gap: 10px; color: var(--side-text); text-decoration: none; padding: 9px 12px; border-radius: 8px; font-weight: 500; }
#nav a i { font-style: normal; width: 18px; text-align: center; opacity: .7; }
#nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
#nav a.active { background: #1e3a8a; color: #fff; }
.sidebar-foot { margin-top: auto; padding: 16px 18px; border-top: 1px solid rgba(255,255,255,.07); display: grid; gap: 12px; }
.legend { display: grid; gap: 4px; font-size: 12px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
.dot.green { background: var(--green-bar); } .dot.yellow { background: var(--yellow-bar); } .dot.red { background: var(--red-bar); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.topbar h1 { font-size: 18px; margin: 0; font-weight: 600; }
.topbar-right { margin-left: auto; color: var(--muted); font-size: 13px; }
.menu-btn { display: none; background: none; border: 0; font-size: 20px; cursor: pointer; }
.view { padding: 20px 24px 48px; display: grid; gap: 16px; align-content: start; grid-template-columns: minmax(0, 1fr); }
.view > * { min-width: 0; }
.split > * { min-width: 0; }

/* ---------- Primitives ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.card-head h2 { font-size: 15px; margin: 0; font-weight: 600; }
.card-head .hint { font-size: 12px; color: var(--muted); }
.card-body { padding: 14px 16px; }
.spacer { flex: 1; }

.toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: #1e40af; }
.btn.danger { color: var(--red); border-color: #fecaca; }
.btn.danger:hover { background: var(--red-bg); }
.btn.warn { background: var(--yellow-bar); border-color: var(--yellow-bar); color: #1f1300; }
.btn.ghost { background: transparent; border-color: rgba(255,255,255,.18); color: var(--side-text); }
.btn.ghost:hover { background: rgba(255,255,255,.06); }
.btn.small { padding: 4px 9px; font-size: 12.5px; }
.btn.icon { padding: 4px 8px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line-strong); }
.seg button.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

input.inp, select.inp, textarea.inp { border: 1px solid var(--line-strong); border-radius: 8px; padding: 6px 10px; background: var(--surface); min-width: 0; }
input.inp:focus, select.inp:focus, textarea.inp:focus { outline: 2px solid var(--primary-soft); border-color: var(--primary); }
label.field { display: grid; gap: 4px; font-size: 12.5px; color: var(--muted); font-weight: 500; }
label.field .inp { color: var(--text); font-size: 14px; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 12px; }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; background: #e2e8f0; color: #334155; }
.badge.green { background: var(--green-bg); color: var(--green); }
.badge.yellow { background: var(--yellow-bg); color: var(--yellow); }
.badge.red { background: var(--red-bg); color: var(--red); }
.badge.blue { background: var(--primary-soft); color: var(--primary); }
.badge.gray { background: #f1f5f9; color: var(--muted); }

/* Progress bar */
.bar { display: grid; gap: 3px; }
.bar-label { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
.bar-label b { color: var(--text); font-weight: 600; }
.bar-track { position: relative; height: 8px; border-radius: 99px; background: #e9eef5; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .3s ease; }
.bar-fill.green { background: var(--green-bar); } .bar-fill.yellow { background: var(--yellow-bar); } .bar-fill.red { background: var(--red-bar); }
.bar.red .bar-label b { color: var(--red); }
.bar.red .bar-track { box-shadow: inset 0 0 0 1px var(--red-bar); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi .k-label { font-size: 12.5px; color: var(--muted); }
.kpi .k-value { font-size: 24px; font-weight: 700; margin-top: 2px; }
.kpi .k-sub { font-size: 12px; color: var(--muted); }
.kpi.red .k-value { color: var(--red); } .kpi.yellow .k-value { color: var(--yellow); } .kpi.green .k-value { color: var(--green); }

/* Issues */
.issues { display: grid; gap: 6px; }
.issue { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border-radius: 8px; font-size: 13px; border: 1px solid transparent; }
.issue .ic { flex: none; font-weight: 700; width: 18px; text-align: center; }
.issue.error { background: var(--red-bg); color: #7f1d1d; border-color: #fecaca; }
.issue.warning { background: var(--yellow-bg); color: #713f12; border-color: #fde68a; }
.issue.info { background: #eff6ff; color: #1e3a8a; border-color: #bfdbfe; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* ---------- Data grid (inline editing แบบ Excel) ---------- */
.grid-wrap { overflow: auto; max-width: 100%; }
table.grid { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
table.grid th { position: sticky; top: 0; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 12.5px; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
table.grid td { padding: 0; border-bottom: 1px solid var(--line); height: 36px; vertical-align: middle; }
table.grid td.ro { padding: 6px 10px; white-space: nowrap; }
table.grid td.ro .sub { font-size: 12px; color: var(--muted); white-space: normal; max-width: 240px; }
table.grid td.ro.wrap { white-space: normal; }
table.grid td.num, table.grid th.num { text-align: right; }
table.grid tbody tr:hover td { background: #f8fbff; }
table.grid td .cell { width: 100%; height: 36px; border: 0; background: transparent; padding: 6px 10px; outline: none; border-radius: 0; }
table.grid td .cell:hover { background: #f1f5ff; }
table.grid td .cell:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--primary); }
table.grid td input.cell[type=number] { text-align: right; }
table.grid td.saving .cell { background: #f1f5f9; }
table.grid td.err .cell { box-shadow: inset 0 0 0 2px var(--red-bar); background: #fff5f5; }
table.grid tr.row-yellow td { background: #fffbeb; }
table.grid tr.row-red td { background: #fef2f2; }
table.grid tr.row-green td { background: #f6fef9; }
table.grid tr.row-yellow td:first-child { box-shadow: inset 4px 0 0 var(--yellow-bar); }
table.grid tr.row-red td:first-child { box-shadow: inset 4px 0 0 var(--red-bar); }
table.grid tr.row-muted td { color: var(--muted); }
table.grid tfoot td { padding: 8px 10px; font-weight: 600; background: var(--surface-2); }
.grid-actions { width: 1%; white-space: nowrap; padding: 0 6px !important; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; padding: 12px 16px; background: var(--surface-2); border-top: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); }
.addrow label.field { min-width: 110px; }

/* ---------- Timeline ---------- */
.timeline { display: grid; grid-template-columns: repeat(var(--days), minmax(160px, 1fr)); gap: 10px; overflow-x: auto; padding-bottom: 4px; }
.timeline.day-mode { grid-template-columns: 1fr; }
.day { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 260px; box-shadow: var(--shadow); }
.day.today { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
.day-head { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 6px; }
.day-head .dname { font-weight: 600; }
.day-head .dsub { font-size: 12px; color: var(--muted); }
.day-head .badge { margin-left: auto; }
.day-cap { padding: 10px 12px; display: grid; gap: 7px; border-bottom: 1px dashed var(--line); background: var(--surface-2); }
.day-cap h4, .day-cnts h4 { margin: 0; font-size: 11.5px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
.day-cnts { padding: 10px 12px; display: grid; gap: 8px; align-content: start; }
.day-mode .day-cnts { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.day-mode .day-cnts h4 { grid-column: 1 / -1; }
.day-mode .day-cap { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.day-mode .day-cap h4 { grid-column: 1 / -1; }
.cnt { border: 1px solid var(--line); border-left: 4px solid var(--green-bar); border-radius: 8px; padding: 8px 10px; display: grid; gap: 6px; cursor: pointer; background: var(--surface); text-decoration: none; color: inherit; }
.cnt:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.cnt.yellow { border-left-color: var(--yellow-bar); }
.cnt.red { border-left-color: var(--red-bar); background: #fffafa; }
.cnt-top { display: flex; align-items: center; gap: 4px 6px; flex-wrap: wrap; }
.day .bar-label { font-size: 11.5px; flex-wrap: wrap; gap: 0 6px; }
.cnt { min-width: 0; }
.cnt-top .mono { font-weight: 600; }
.cnt-top .badge { margin-left: auto; }
.cnt-sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Container editor ---------- */
.split { display: grid; grid-template-columns: 320px 1fr; gap: 16px; align-items: start; }
.clist { max-height: calc(100vh - 170px); overflow: auto; }
.clist-item { display: grid; gap: 5px; padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; text-decoration: none; color: inherit; border-left: 3px solid transparent; }
.clist-item:hover { background: var(--surface-2); }
.clist-item.active { background: #eff6ff; border-left-color: var(--primary); }
.clist-item .row1 { display: flex; gap: 6px; align-items: center; }
.clist-item .row1 .badge { margin-left: auto; }
.clist-group { padding: 6px 14px; font-size: 12px; font-weight: 600; color: var(--muted); background: var(--surface-2); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
.util-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.layer-hint { font-size: 12.5px; color: var(--muted); padding: 8px 16px; border-top: 1px dashed var(--line); }

/* ---------- Modal & toast ---------- */
.modal-back { position: fixed; inset: 0; background: rgba(15, 23, 42, .45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; width: min(960px, 100%); max-height: calc(100vh - 32px); display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
.modal.narrow { width: min(560px, 100%); }
.modal-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; }
.modal-head h3 { margin: 0; font-size: 16px; }
.modal-head .x { margin-left: auto; border: 0; background: none; font-size: 20px; cursor: pointer; color: var(--muted); }
.modal-body { padding: 16px 18px; overflow: auto; display: grid; gap: 14px; }
.modal-foot { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toasts { position: fixed; right: 16px; bottom: 16px; display: grid; gap: 8px; z-index: 60; }
.toast { background: #0f172a; color: #fff; padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); max-width: 420px; font-size: 13.5px; animation: slide .2s ease; }
.toast.error { background: var(--red); } .toast.success { background: var(--green); } .toast.warn { background: #92400e; }
@keyframes slide { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

.stat-row { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; }
.stat-row b { font-size: 15px; }
.alloc { font-size: 12px; }
.alloc span { display: inline-block; margin: 1px 4px 1px 0; padding: 1px 6px; border-radius: 6px; background: #f1f5f9; }
.alloc span.late { background: var(--red-bg); color: var(--red); }

@media (max-width: 1024px) {
  .split { grid-template-columns: 1fr; }
  .clist { max-height: 300px; }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; z-index: 40; width: 248px; transform: translateX(-100%); transition: transform .2s; }
  .app.nav-open .sidebar { transform: none; }
  .menu-btn { display: block; }
  .view { padding: 16px; }
  .topbar { padding: 12px 16px; }
  .util-pair { grid-template-columns: 1fr; }
}

/* ===================== งานตู้ Shipment (KK) ===================== */
.nav-group { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; padding: 12px 12px 4px; font-weight: 600; }
.site-banner { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: baseline; padding: 10px 14px; border-radius: var(--radius); background: #fffbeb; border: 1px solid #fde68a; font-size: 13px; }
.site-banner b { color: #78350f; }
.sub { font-size: 12px; color: var(--muted); }
.ship-code { font-family: var(--mono); font-weight: 600; color: var(--primary); text-decoration: none; }
.ship-code:hover { text-decoration: underline; }
.cl-tag { display: inline-block; font-size: 12px; font-weight: 600; color: #fff; background: var(--red-bar); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }

.pgrid-wrap { overflow: auto; max-height: calc(100vh - 230px); border-radius: var(--radius); }
table.pgrid { border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 100%; }
table.pgrid th, table.pgrid td { border-bottom: 1px solid var(--line); border-right: 1px solid #eef2f7; padding: 6px 8px; vertical-align: middle; background: var(--surface); }
table.pgrid thead th { position: sticky; top: 0; z-index: 3; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; text-align: left; white-space: nowrap; }
table.pgrid thead tr.total td { position: sticky; top: 45px; z-index: 3; background: #f1f5f9; border-bottom: 2px solid var(--line-strong); }
table.pgrid .sticky-col { position: sticky; left: 0; z-index: 2; min-width: 190px; max-width: 220px; box-shadow: 1px 0 0 var(--line); }
table.pgrid thead .sticky-col { z-index: 5; }
table.pgrid th.dcol { text-align: center; min-width: 54px; padding: 4px; line-height: 1.2; }
table.pgrid th.dcol.today, table.pgrid td.today { background: #eff6ff; }
table.pgrid th.dcol.off, table.pgrid td.off { background-image: repeating-linear-gradient(45deg, transparent 0 5px, rgba(100,116,139,.08) 5px 10px); }
table.pgrid td.cnt-cell { text-align: center; font-size: 14px; }
table.pgrid td.cnt-cell.yellow { background: var(--yellow-bg); color: var(--yellow); }
table.pgrid td.cnt-cell.red { background: var(--red-bg); color: var(--red); box-shadow: inset 0 -3px 0 var(--red-bar); }
table.pgrid td.cnt-cell .over { font-size: 11px; font-weight: 700; }
table.pgrid td.pc { position: relative; padding: 0; text-align: center; min-width: 54px; height: 44px; }
table.pgrid td.pc input.pcell { width: 100%; height: 44px; border: 0; background: transparent; text-align: center; font: inherit; font-weight: 600; font-size: 14px; outline: none; -moz-appearance: textfield; }
table.pgrid td.pc input.pcell::-webkit-inner-spin-button, table.pgrid td.pc input.pcell::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
table.pgrid td.pc input.pcell:hover { background: #f1f5ff; }
table.pgrid td.pc input.pcell:focus { background: #fff; box-shadow: inset 0 0 0 2px var(--primary); }
table.pgrid td.pc .past { color: var(--muted); font-size: 12.5px; }
table.pgrid td.pc.done { background: #f0fdf4; }
table.pgrid td.pc.done .past { color: var(--green); font-weight: 600; }
table.pgrid td.pc.closing { box-shadow: inset -3px 0 0 var(--red-bar); }
table.pgrid td.pc.fr { box-shadow: inset 3px 0 0 var(--yellow-bar); }
table.pgrid td.pc.closing.fr { box-shadow: inset -3px 0 0 var(--red-bar), inset 3px 0 0 var(--yellow-bar); }
table.pgrid td.pc.late { background: var(--red-bg); }
table.pgrid td.pc .mark { position: absolute; top: 1px; font-size: 9.5px; font-weight: 700; line-height: 1; padding: 1px 3px; border-radius: 3px; pointer-events: none; }
table.pgrid td.pc .mark.cl { right: 4px; background: var(--red-bar); color: #fff; }
table.pgrid td.pc .mark.fr { left: 4px; background: var(--yellow-bar); color: #1f1300; }
table.pgrid td.pc .lockdot { position: absolute; bottom: 1px; right: 3px; font-size: 9.5px; color: var(--primary); pointer-events: none; }
table.pgrid tr.lv-red td.sticky-col { box-shadow: inset 4px 0 0 var(--red-bar), 1px 0 0 var(--line); }
table.pgrid tr.lv-yellow td.sticky-col { box-shadow: inset 4px 0 0 var(--yellow-bar), 1px 0 0 var(--line); }
table.pgrid tr.done td { color: var(--muted); }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); align-items: center; }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; }
.lg { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--line-strong); }
.lg.cl { background: var(--red-bar); } .lg.fr { background: var(--yellow-bar); } .lg.late { background: var(--red-bg); }
.lg.done { background: #dcfce7; } .lg.off { background-image: repeating-linear-gradient(45deg, #fff 0 3px, #cbd5e1 3px 5px); }

.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.flow-step { display: flex; gap: 8px; align-items: flex-start; padding: 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-2); }
.flow-n { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px; }
a.btn { text-decoration: none; color: inherit; }

  return h('div.card',
    h('div.card-head', h('h2', 'สำรอง / กู้คืนข้อมูล'), st.mode === 'browser' ? h('span.badge.blue', 'โหมด GitHub Pages') : h('span.badge.gray', 'โหมด Server')),
    h('div.card-body', { style: { display: 'grid', gap: '10px' } },
      h(`div.issue.${st.persistent ? 'info' : 'error'}`, h('span.ic', 'i'), h('span', where)),
      h('div.toolbar',
        h('a.btn.primary', { href: `${apiBase}/admin/backup` }, '⬇ ดาวน์โหลดไฟล์สำรอง (.json)'),
        h('button.btn', { type: 'button', onclick: () => file.click() }, '⬆ กู้คืนจากไฟล์สำรอง'),
        h('button.btn.danger', {
          type: 'button',
          onclick: async () => {
            if (!(await confirmDialog('ล้างข้อมูลทั้งหมด',
              'ลบ Shipment, แผนตู้, เบอร์ตู้/ซีล, คำสั่งซื้อ และสินค้า (SKU) ทั้งหมด รวมข้อมูลตัวอย่าง — การตั้งค่าหน้างาน (ตู้/วัน, เวลาโหลด), Bag/Pallet และประเภทตู้ยังอยู่ แนะนำให้ดาวน์โหลดไฟล์สำรองก่อน ต้องการล้างข้อมูลหรือไม่?',
              { okLabel: 'ล้างข้อมูลทั้งหมด', okCls: 'danger' }))) return;
            try {
              await api.post('/admin/clear-all');
              await getMeta(true);
              await getKkMeta(true);
              toast('ล้างข้อมูลแล้ว — เริ่มนำเข้า Export Plan หรือเพิ่ม Shipment ได้เลย', 'success', 6000);
              rerender();
            } catch (e) { toast(e.message, 'error', 6000); }
          },
        }, '🗑 ล้างข้อมูลทั้งหมด (เริ่มใช้งานจริง)'),
        file,
        h('span.muted', 'ไฟล์สำรองมีข้อมูลทั้งหมด (Shipment, แผน, เบอร์ตู้/ซีล) — ส่งให้เพื่อนร่วมงานกู้คืนเพื่อเห็นข้อมูลชุดเดียวกัน'))));
}

});
__require("js/app.js");
</script>
